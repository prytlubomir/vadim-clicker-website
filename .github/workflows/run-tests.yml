name: run-tests
on:
  push:
    branches:
      - workflows
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm i
      - run: npm test
  hello-world:
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - run: echo "hello world"
