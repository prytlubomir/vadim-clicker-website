name: run-tests
on:
  push:
    branches:
      - workflows

env:
  AWS_REGION: eu-west-2
  FUNCTION_NAME: wftest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm i
      - run: npm test
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - name: Create a ZIP-archive  
        run: git archive --format=zip --output artifact.zip HEAD
      - name: Install dependencies
        run: npm i
      - name: Add node_modules to the archive
        run: zip -r artifact.zip node_modules
